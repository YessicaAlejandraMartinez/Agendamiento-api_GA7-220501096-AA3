# Servidor - puerto 8081 para no chocar con Tomcat
server.port=8081

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sergiocalderon_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Nombre de la aplicación
spring.application.name=agendamiento-api

# Configuración de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Carpeta donde se guardan las imágenes
app.upload.dir=uploads/catalogo

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.info.title=Sergio Calderón Atelier API
springdoc.info.version=1.0.0
springdoc.info.description=API REST del Sistema de Agendamiento de Citas

# JWT
jwt.secret=SergioCalderon2026AtelierModasSecretKeyMuyLargaParaJWT
jwt.expiration=86400000